# K4 — import-linter configuration of the target model ("Soll") of the conformance test
# repository `ma-conformance-testrepo`. Baseline tool K4 of the campaign.
#
# Pinned measurement state (protocol §1): import-linter 2.13, grimp 3.15, Python 3.12.3,
# SQLAlchemy 2.0.52. EVERY run uses `--no-cache` (protocol §1, Rev. 5).
#
#     PYTHONPATH=<testrepo>/src lint-imports --config <this file> --no-cache
#
# THIS FILE EXPRESSES THE TARGET ARCHITECTURE, NOT THE INJECTION PLAN (protocol §1
# Rev. 13). It is derived from the whitelist of `c1_komponentenschnitt.md` §4 and from the
# contract types preregistered in protocol §3. A contract without a matching injection is
# correct: it contributes to the false-positive measurement, exactly as R-CORE-1 does on
# the checker side.
#
# Thirteen contracts:
#   1  layers            the layered spine of the three bounded contexts
#   6  forbidden         the skip-call complement of the spine, two per context
#   1  protected         the adapter internals
#   1  independence      orders vs. billing
#   1  acyclic_siblings  cycles between sibling packages
#   3  layers/exhaustive one per context, layer list taken FROM THE FILE TREE
#
# The SHA256 of this file is a hashed measurement input and falls under the change
# freeze of protocol §1 Rev. 10; see `MANIFEST.md`.

[importlinter]
root_packages =
    depot
# The switch STAYS; its justification was replaced by protocol §1 Rev. 21 (part C1 of the C2c
# order). It no longer rests on the cell FORBIDDEN_SIGNATURE_TYPE / K4 = FP⁴ — that cell fell
# with Rev. 20 and stands at "no" (footnote 4). What carries the switch now: the external
# imports stay VISIBLE in the graph, and that K4 nevertheless reports nothing is therefore an
# INSPECTABLE non-coverage rather than an artefact of invisibility — the difference between
# "not found" and "not looked for". Measured to have NO effect on any of the thirteen
# contracts (`13 kept, 0 broken` with AND without the switch, c2b report §B5 (k)); the cost of
# the setting is zero.
include_external_packages = True


# ── 1 × layers — the spine ────────────────────────────────────────────────────────────
#
# `exhaustive` is deliberately NOT set here. `mappers` is a direct child of every context
# package but is NOT part of the spine ordering; under `exhaustive = True` it would count
# as an undeclared child and the contract would break ON THE CLEAN BASELINE
# (Komponentenschnitt §6.1). Exhaustiveness is carried by the three separate contracts at
# the bottom of this file, which declare all five children.
#
# `layers` is RELAXED: it forbids upward imports, not skipped layers. The skip-call half
# is the six `forbidden` contracts below (protocol §3, footnote 1 — n−2 extra contracts
# for n layers; here 2 per context).

[importlinter:contract:spine]
name = Layered spine of every bounded context
type = layers
containers =
    depot.identity
    depot.orders
    depot.billing
layers =
    api
    services
    repository
    models


# ── 6 × forbidden — the skip-call complement ──────────────────────────────────────────
#
# Derived MECHANICALLY from the layer list, not from the injection plan: for the four
# layers api / services / repository / models the non-adjacent downward pairs are
# api→repository, api→models and services→models — two contracts per context.
#
# `allow_indirect_imports = True` on ALL SIX. Without it they break on the clean baseline
# at the legitimate chains `api → services → repository → models` and
# `api → mappers → models`, because a `forbidden` contract evaluates transitively by
# default (`c2a_bericht_contract_semantik.md` §1.1c). The switch restricts the check to
# DIRECT imports, which is exactly what a skip call is. Protocol §3, amendment (h) of the
# B38 check list.

[importlinter:contract:skip-identity-api]
name = identity.api skips no layer
type = forbidden
source_modules =
    depot.identity.api
forbidden_modules =
    depot.identity.repository
    depot.identity.models
allow_indirect_imports = True

[importlinter:contract:skip-identity-services]
name = identity.services skips no layer
type = forbidden
source_modules =
    depot.identity.services
forbidden_modules =
    depot.identity.models
allow_indirect_imports = True

[importlinter:contract:skip-orders-api]
name = orders.api skips no layer
type = forbidden
source_modules =
    depot.orders.api
forbidden_modules =
    depot.orders.repository
    depot.orders.models
allow_indirect_imports = True

[importlinter:contract:skip-orders-services]
name = orders.services skips no layer
type = forbidden
source_modules =
    depot.orders.services
forbidden_modules =
    depot.orders.models
allow_indirect_imports = True

[importlinter:contract:skip-billing-api]
name = billing.api skips no layer
type = forbidden
source_modules =
    depot.billing.api
forbidden_modules =
    depot.billing.repository
    depot.billing.models
allow_indirect_imports = True

[importlinter:contract:skip-billing-services]
name = billing.services skips no layer
type = forbidden
source_modules =
    depot.billing.services
forbidden_modules =
    depot.billing.models
allow_indirect_imports = True


# ── 1 × protected — the adapter internals ─────────────────────────────────────────────
#
# `protected`, NOT `forbidden`. A `forbidden` contract in its default setting evaluates
# transitively and would already break on the clean baseline at the measured chain
# `services → depot.core.adapters.storage → internal` (c2a §1.1c). The preregistered cell
# K4 / PROTECTED_MODULE = "ja" is bound to THIS contract type (protocol §3, annotation ᴾ).
# `protected` also states the permission positively, which `forbidden` can express only by
# enumerating the complement.

[importlinter:contract:adapters-internal]
name = Only the adapter facade may reach into the adapter internals
type = protected
protected_modules =
    depot.core.adapters.internal
allowed_importers =
    depot.core.adapters


# ── 1 × independence — orders vs. billing ─────────────────────────────────────────────
#
# import-linter 2.13 has NO `allow_indirect_imports` for this type; `independence`
# evaluates transitively and cannot be switched off (c2a §3). A chain
# orders → core → billing or orders → identity → billing would be reported in a commit
# whose injection has nothing to do with INDEPENDENCE. The condition therefore sits in
# the component cut, as build rule I1 (Komponentenschnitt §4.6) — checked by
# `tools/validate_soll.py` point (4) on every injection commit, not here.

[importlinter:contract:orders-billing-independent]
name = orders and billing are mutually independent
type = independence
modules =
    depot.orders
    depot.billing


# ── 1 × acyclic_siblings — cycles between sibling packages ────────────────────────────
#
# ONE contract, `ancestors = depot`, default depth. The `ancestor` belongs in the
# measurement manifest: `acyclic_siblings` descends from the ancestor and reports its
# removal set RELATIVE TO IT (leading dot), so without the ancestor the mapping
# finding → level is not reconstructable (c2a §2.2a).
#
# Known blind spot, preregistered as K4 = "nein": the type compares SIBLINGS only and
# does not see a cycle between a package and its own sub-module — the
# CYCLE_PARENT_CHILD scenario (B9+ F5). That is measured here, not assumed; see the
# sharpness proof in the report.

[importlinter:contract:acyclic]
name = No cycles between sibling packages
type = acyclic_siblings
ancestors =
    depot


# ── 3 × layers with exhaustive — one per context ──────────────────────────────────────
#
# THE LAYER LIST COMES FROM THE FILE TREE OF THE CLEAN BASELINE, NOT FROM THE SOLL MODULE
# LIST (protocol §3, amendment (g)). The Soll lists the four phantom target locations of
# I25-I28; were the list built from it, the target location would be declared, the
# contract would run KEPT and the preregistered cell K4 / INCORRECT_LOCATION =
# "teilweise" would be unfulfillable — measured in `b9plus_nachtrag_namensregeln.md` §3.
#
# `depot.billing` gets ONE contract, although two phantoms (I26, I28) land under it.
# The contract reports every undeclared direct child; two of them are two findings in one
# contract, not a reason for two contracts.
#
# THE FIVE CHILDREN SIT ON ONE SINGLE, NON-INDEPENDENT LAYER (`:` separator,
# `layers.py:21`, `_NON_INDEPENDENT_LAYER_DELIMITER`). They may therefore import each
# other freely and these contracts impose NO ordering whatsoever — they check
# exhaustiveness and nothing else.
#
# Measured reason: with the five children written as five ordered layers, a
# LAYER_BACK_CALL inside a context breaks the spine contract, `acyclic_siblings` AND the
# exhaustive contract of that context — a TRIPLE finding, where protocol §4 preregisters
# a DOUBLE one (`layers` + `acyclic_siblings`). The ordering would be enforced twice by
# two contracts, and the preregistered co-finding count would be changed by a
# configuration choice rather than by a measurement. On one non-independent layer the
# spine contract stays the sole owner of the ordering.

[importlinter:contract:exhaustive-identity]
name = identity declares all of its direct children
type = layers
containers =
    depot.identity
layers =
    api : mappers : services : repository : models
exhaustive = True

[importlinter:contract:exhaustive-orders]
name = orders declares all of its direct children
type = layers
containers =
    depot.orders
layers =
    api : mappers : services : repository : models
exhaustive = True

[importlinter:contract:exhaustive-billing]
name = billing declares all of its direct children
type = layers
containers =
    depot.billing
layers =
    api : mappers : services : repository : models
exhaustive = True
