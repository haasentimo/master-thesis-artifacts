resources:
- id: API
  name: API
  subtitle: HTTP handlers exposing the bookshop functionality.
- id: Application
  name: Application
  subtitle: Use-case services orchestrating domain objects and infrastructure 
    adapters.
- id: Domain
  name: Domain
  subtitle: Pure business model entities, aggregates, and rules.
- id: Infrastructure
  name: Infrastructure
  subtitle: Persistence and external service adapters (in‑memory repositories, 
    fake payment gateway).
perspectives:
- name: Dependencies
  relations:
  - from: API
    to: Application
    label: depends_on
  - from: API
    to: Domain
    label: depends_on
  - from: Application
    to: Domain
    label: depends_on
  - from: Application
    to: Infrastructure
    label: depends_on
  - from: Infrastructure
    to: Domain
    label: depends_on
