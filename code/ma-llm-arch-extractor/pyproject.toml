[project]
name = "llm-arch-extraction"
version = "0.1.0"
description = "Approach 2: LLM-based architecture extraction from Python code (master's thesis)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "ruamel.yaml>=0.18",
    "openai>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "tiktoken>=0.7"]  # tiktoken: scale-probe diagnostic only

[project.scripts]
llm-arch = "llm_arch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_arch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
